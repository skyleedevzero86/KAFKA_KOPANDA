server:
  port: 8080
  servlet:
    context-path: /api

spring:
  data:
    redis:
      host: localhost
      port: 9379
      password: 123456
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  application:
    name: kafka-kopanda

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: true
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 20
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        packages_to_scan: com.sleekydz86.kopanda.infrastructure.persistence.entities
    defer-datasource-initialization: false

  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Seoul

  profiles:
    active: dev
    group:
      dev:
        - local

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    disable-swagger-default-url: true
    display-request-duration: true
    filter: true
    deep-linking: true
    display-operation-id: false
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    default-model-render-depth: 3
    show-common-extensions: true
    show-extensions: true
  packages-to-scan: com.sleekydz86.kopanda.infrastructure.adapters.in.rest
  paths-to-match: /**
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: true
  use-management-port: false

logging:
  level:
    com.sleekydz86.kopanda: INFO
    org.hibernate.SQL: WARN
    org.hibernate.tool.schema: WARN
    org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl: ERROR
    org.springframework.orm.jpa: WARN
    org.springframework.transaction: WARN
    org.springframework.data.repository.config: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

  admin:
    request-timeout-ms: 5000
    default-api-timeout-ms: 5000
    operation-timeout-ms: 30000
    fetch-timeout-ms: 5000

  consumer:
    group-id: kopanda-consumer
    auto-offset-reset: earliest
    enable-auto-commit: false
    max-poll-records: 500
    max-poll-interval-ms: 300000
    session-timeout-ms: 30000
    heartbeat-interval-ms: 3000
    fetch-min-bytes: 1
    fetch-max-wait-ms: 500
    fetch-max-bytes: 52428800
    max-partition-fetch-bytes: 1048576
    check-crcs: true
    exclude-internal-topics: true
    isolation-level: read_uncommitted

  producer:
    acks: all
    retries: 2147483647
    batch-size: 16384
    linger-ms: 0
    buffer-memory: 33554432
    compression-type: none
    max-request-size: 1048576
    max-block-ms: 60000
    request-timeout-ms: 30000
    delivery-timeout-ms: 120000
    enable-idempotence: false
    max-in-flight-requests-per-connection: 5
    metadata-max-age-ms: 300000
    reconnect-backoff-ms: 50
    retry-backoff-ms: 100

app:
  connection:
    default-port: 9092
    test-timeout-ms: 5000
    max-connections: 100
    connection-pool-size: 10
    default-host: localhost

alerts:
  monitoring:
    enabled: true
    check-interval: 300000 # 5분
    status-refresh-interval: 60000 # 1분
    thresholds:
      consumer-lag:
        warning: 1000
        critical: 10000
      under-replicated-partitions:
        warning: 1
        critical: 5
      offline-partitions:
        warning: 0
        critical: 1

kopanda:
  crypto:
    key: ${KOPANDA_CRYPTO_KEY:}
